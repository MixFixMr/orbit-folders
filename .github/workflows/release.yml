# Creates a draft GitHub release with the plugin files whenever a version tag is pushed.
# The tag must match "version" in manifest.json exactly, for example 1.0.1 (no "v" prefix).
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(jq -r .version manifest.json)
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do"
            exit 0
          fi
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
